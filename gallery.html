        let selectedCategory = 'All';
        let lightboxModal;

        const galleryGrid = document.getElementById('galleryGrid');
        const emptyState = document.getElementById('emptyState');
        const categoryButtons = document.querySelectorAll('.btn-category');
        const lightboxImage = document.getElementById('lightboxImage');
        const lightboxTitle = document.getElementById('lightboxTitle');
        const lightboxTags = document.getElementById('lightboxTags');

        // Initialize Bootstrap Modal
        document.addEventListener('DOMContentLoaded', function() {
            const lightboxModalElement = document.getElementById('lightboxModal');
            lightboxModal = new bootstrap.Modal(lightboxModalElement);
        });
        function renderGallery(category = 'All') {
            const filteredImages = category === 'All' 
                ? images 
                : images.filter(img => img.category.includes(category));

            galleryGrid.innerHTML = '';

            if (filteredImages.length === 0) {
                emptyState.classList.remove('d-none');
                return;
            } else {
                emptyState.classList.add('d-none');
            }

            filteredImages.forEach((image, index) => {
                const isLarge = index % 7 === 0 || index % 7 === 3;
                
                const col = document.createElement('div');
                col.className = `col-lg-${isLarge ? '6' : '3'} col-md-${isLarge ? '6' : '4'} col-sm-6`;
                
                const item = document.createElement('div');
                item.className = `gallery-item ${isLarge ? 'large' : ''}`;
                item.style.animationDelay = `${index * 0.05}s`;
                
                item.innerHTML = `
                    <img src="${image.url}" alt="${image.alt}" loading="lazy">
                    <div class="gallery-overlay">
                        <div class="zoom-icon">
                            <i class="bi bi-zoom-in"></i>
                        </div>
                        <div class="gallery-info">
                            <h3 class="gallery-item-title">${image.title}</h3>
                            <div>
                                ${image.category.map(cat => `<span class="gallery-tag">${cat}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                    <div class="corner-accent"></div>
                `;
                
                item.addEventListener('click', () => openLightbox(image));
                col.appendChild(item);
                galleryGrid.appendChild(col);
            });
        }

        function openLightbox(image) {
            lightboxImage.src = image.url;
            lightboxImage.alt = image.alt;
            lightboxTitle.textContent = image.title;
            lightboxTags.innerHTML = image.category.map(cat => 
                `<span class="lightbox-tag">${cat}</span>`
            ).join('');
            
            lightboxModal.show();
        }

        categoryButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                categoryButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                selectedCategory = btn.dataset.category;
                renderGallery(selectedCategory);
            });
        });

        renderGallery();

        
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var swiperHero = new Swiper(".mySwiper", {
                slidesPerView: 3, 
                centeredSlides: true,
                spaceBetween: 50, 
                loop: true,
                speed: 1000,
                grabCursor: true,
                navigation: { nextEl: ".next-btn", prevEl: ".prev-btn" },
                breakpoints: {
                    567: { slidesPerView: 3, spaceBetween: 70 },
                    992: { slidesPerView: 3, spaceBetween: 50 }
                }
            });

            var swiperPackages = new Swiper(".packageSwiper", {
            slidesPerView: 1,
            spaceBetween: 20,
            loop: true,
            speed: 600,
            grabCursor: true,      // Kursor berubah jadi tangan agar bisa di-drag
            simulateTouch: true,   // Memungkinkan scroll dengan klik tahan kursor
            navigation: { 
                nextEl: ".next-package", 
                prevEl: ".prev-package" 
            },
            breakpoints: {
                // Di HP menampilkan 1.2 slide agar user tahu itu bisa di-scroll
                320: { slidesPerView: 1.1, spaceBetween: 15 }, 
                576: { slidesPerView: 2, spaceBetween: 20 },
                992: { slidesPerView: 3, spaceBetween: 25 },
                1400: { slidesPerView: 4, spaceBetween: 30 }
            }
        });
        });

        document.addEventListener("DOMContentLoaded", function () {
            const includes = document.querySelectorAll("[data-include]");
            includes.forEach(el => {
                const file = el.getAttribute("data-include");
                fetch(file).then(res => res.text()).then(data => { el.innerHTML = data; }).catch(err => console.error(err));
            });
        });
    </script>
