<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WonderLand - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="nav-hook"></div>

    <section class="hero text-center text-white">
        <div class="container py-5">
            <div class="mb-3">
                <i class="bi bi-mountain fs-1"></i> 
            </div>
            
            <p class="text-uppercase ls-2 mb-2 fw-light">Welcome to your</p>
            <h1 class="display-1 fw-bold mb-4" style="text-shadow: 2px 4px 10px rgba(0,0,0,0.3);">WonderLand</h1>
            
            <p class="lead mx-auto mb-5" style="max-width: 700px; font-weight: 300; opacity: 0.9;">
                We organize tours in Indonesia and neighboring countries. <br>
                Discover the beauty of your home country with WonderLand Tour.
            </p>

            <div class="row justify-content-center">
                <div class="col-lg-10 col-xl-9">
                    <div class="bg-white rounded-pill p-2 shadow-lg d-flex align-items-center flex-column flex-md-row">
                        <div class="flex-grow-1 px-4 d-flex align-items-center w-100 border-end border-light">
                            <i class="bi bi-geo-alt text-muted me-2"></i>
                            <input type="text" class="form-control border-0 shadow-none py-3" placeholder="Where do you want to go?">
                        </div>
                        <div class="flex-grow-1 px-4 d-flex align-items-center w-100">
                            <i class="bi bi-calendar3 text-muted me-2"></i>
                            <input type="text" class="form-control border-0 shadow-none py-3" placeholder="Choose Date">
                        </div>
                        <button class="btn btn-dark rounded-pill px-5 py-3 fw-bold text-uppercase transition-all" 
                                style="background-color: #433301; border: none; letter-spacing: 1px;">
                            Search Tours
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section id="destinasi" class="py-5 bg-light">
        <div class="container">
            <h2 class="text-center fw-bold mb-5">Popular Destinations</h2>
            </div>
    </section>

    <div id="footer-hook"></div>

    </body>
</html>
</html>
